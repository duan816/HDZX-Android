name: Public source audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/check_public_edition.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node tools/test_public_navigation.mjs
